faqs:
  - question: מה ההבדל בין שולחן שוק לארוחה מוגשת?
    answer: >-
      בשולחן שוק אין מנות לשולחנות. האורחים קמים, בוחרים מה שמתחשק, וחוזרים
      לסיבוב נוסף. האווירה משוחררת יותר, והרמה נשארת גבוהה.
  - question: אפשר להקים שולחן שוק בחצר הבית?
    answer: כן, וגם במשרד, ביער או במדבר. אנחנו מביאים את כל התשתית.
  - question: יש אפשרויות לצמחונים?
    answer: >-
      כן. יש ירקות צלויים, סלטים, לחמים ורטבים, ואפשר להוסיף מנות עיקריות
      צמחוניות וטבעוניות מהאש.
  - question: כמה זה עולה?
    answer: >-
      המחיר תלוי במספר האורחים, בנתחים ובמיקום. שלחו לנו פרטים ונחזור עם הצעת
      מחיר.
