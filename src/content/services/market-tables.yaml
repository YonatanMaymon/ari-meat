sections:
  - heading:
      name: ''
      slug: intro
    text: >-
      יש אירועים שבהם אתם רוצים לשבור את הדיסטנס, לוותר על ההגשה הפורמלית
      לשולחנות ופשוט לתת לאוכל לדבר בשם עצמו. שולחן שוק בשרי הוא הפתרון המושלם
      למי שמחפש אירוע באווירה משוחררת, שמחה ומלאה בסטייל. מדובר בחוויה ויזואלית
      וקולינרית עוצמתית: שולחן ענק, עמוס בכל טוב, שמפגיש בין נתחי בשר מובחרים,
      ירקות צבעוניים מהגליל, לחמים חמים וממרחים בעבודת יד.


      אצלי בארי קייטרינג, שולחן השוק הוא לא סתם הגשה של אוכל, אלא הצגה שלמה.
      בתור שף בשרים שחי את עולם האש, אני מאמין שהעין אוכלת ראשונה, ולכן כל שולחן
      בשרים מעוצב שאנחנו מקימים הוא יצירת אמנות של טקסטורות, ריחות וטעמים.
  - heading:
      name: מה זה בעצם שולחן שוק בשרי ולמי זה מתאים?
      slug: mh-zh-batzm-shvlhn-shvk-bshry-vlmy-zh-mtaym
    text: >-
      הרעיון הוא פשוט אבל הביצוע דורש מיומנות רבה. במקום צלחות אישיות ומלצרים
      שמתרוצצים, אנחנו מקימים בופה בשרים עשיר ושופע שנראה כמו שוק אוכל תוסס
      ומזמין. זהו שולחן שוק כשר לאירועים שלא מפסיק להתחדש לאורך כל הערב. הנתחים
      יוצאים מהמעשנות והגרילים כשהם בשיא הדיוק שלהם, נפרסים לעיני האורחים
      ומונחים על השולחן לצד הררי תוספות.


      הקונספט הזה הפך למבוקש מאוד בשנים האחרונות בזכות היכולת שלו לייצר
      אינטראקציה בין האורחים. בשולחן שוק ליום הולדת או בערב חברה, אנשים לא
      תקועים בכיסא; הם קמים, בוחרים מה שמתחשק להם, חוזרים לסיבוב שני (ושלישי)
      ומדברים סביב השפע. זהו קרנבל בשרים אמיתי שמתאים ל:


      - **קייטרינג לאירועים משפחתיים:** חינות, מסיבות אירוסין, בריתות או ימי
      הולדת עגולים.

      - **שולחן שוק כשר לאירועי חברה:** ערבי הרמת כוסית או חגיגות סוף שנה
      באווירה לא רשמית.

      - **אירוע בשרים בחצר:** כשרוצים לארח ברמה של מסעדה בלי התחושה הכבדה של
      אירוח פורמלי.
  - heading:
      name: 'עמדות בשר פעילות: ה"לייב שואו" של האש'
      slug: amdvt-bshr-paylvt-h-lyyb-shvav-shl-hash
    text: >-
      מעבר לשולחן המרכזי, הלב של האירוע הוא העמדות בשר פעילות. אני לא מאמין
      בלהחביא את המטבח מאחורי פרגוד. האורחים שלכם צריכים לראות, להריח ולהרגיש את
      העוצמה של האש. אנו מקימים דוכני מזון בשריים לאירועים שבהם הכל קורה בזמן
      אמת.


      כשאתם מזמינים עמדת בשר לאירועים ממני, אתם מקבלים שף בשרים שעומד מאחורי
      גריל דרום-אמריקאי אותנטי או מעשנה. הנתחים – מאסאדו בצלייה ארוכה ועד
      אנטריקוט משויש – נצלים מול הקהל. הפריסה נעשית במקום, העשן עולה באוויר,
      והאורחים יכולים לבחור בדיוק את מידת העשייה והנתח שהם אוהבים. זהו שף בשרים
      לאירועים שנותן הצגה של מקצועיות, ניקיון ואהבה לחומר הגלם.
  - heading:
      name: חוויה ויזואלית (Instagrameble) בסטנדרט גבוה
      slug: hvvyh-vyzvalyt-instagrameble-bstndrt-gbvh
    text: >-
      בעידן של היום, אירוע שלא צולם כאילו לא קרה. שולחן שוק בשרי מעוצב הוא מגנט
      למצלמות. השפע, הצבעוניות של הירקות הגליליים, הנתחים המגרים והסידור האלגנטי
      יוצרים מראה יוקרתי ומזמין. למרות האווירה המשוחררת, אנחנו מקפידים על סטנדרט
      גבוה מאוד של היגיינה, אסתטיקה וסדר. הצוות שלי ואני דואגים שהשולחן ייראה
      מלא ומזמין מהאורח הראשון ועד האחרון.
  - heading:
      name: 'לוגיסטיקה ללא דאגות: השוק מגיע אליכם'
      slug: lvgystykh-lla-dagvt-hshvk-mgya-alykm
    text: >-
      היופי בשולחן בשרים לאירועים הוא הגמישות הלוגיסטית שלו. אנחנו מומחים בלהביא
      את הקרנבל הזה לכל מקום. אנחנו מגיעים לכל חלקי הארץ – מרמת הגולן והגליל,
      דרך אזור המרכז, גוש דן והשרון, ועד להרי ירושלים והדרום הרחוק. אנחנו מביאים
      איתנו את כל התשתית: שולחנות מעוצבים, גרילים, מעשנות, כלי הגשה, תאורה במידת
      הצורך וכל מה שנדרש כדי שהמקום שלכם יהפוך לשוק אוכל בשרי תוך שעות ספורות.


      אנחנו מגיעים לשטח לפחות 5 שעות לפני תחילת האירוע. למה? כי צלייה ועישון
      בשרים זו אמנות של סבלנות. אנחנו מדליקים את האש, מכינים את הנתחים, מעצבים
      את השולחן ומוודאים שכל פרט ופרט מוכן לרגע שבו האורחים יכנסו ויגידו "וואו".
  - heading:
      name: מה בתפריט? שפע גלילי פוגש מסורת ארגנטינאית
      slug: mh-btpryt-shpa-glyly-pvgsh-msvrt-argntynayt
    text: >-
      השולחנות והעמדות שלנו תמיד נראים כמו חגיגה לעיניים. בקרנבל הבשרים של ארי
      קייטרינג תוכלו לדוגמא למצוא:


      - **נתחי פרימיום:** אסאדו שנפרס מהעצם, אנטריקוט משויש, סינטה מיושנת
      ונקניקיות בוטיק בייצור עצמי.

      - **הלחמים:** פוקצ'ות חמות מהטאבון, לחמים כפריים איכותיים או אמפנדס בעבודת
      יד.

      - **התוספות:** ירקות צלויים באש, תפוחי אדמה מדורה, סלטים גליליים רעננים
      מרכיבים טריים בלבד.

      - **רטבים בעבודת יד:** צ'ימיצ'ורי אותנטי, איולי עשבי טיבול, קרם חצילים
      וסלק ועוד הפתעות שמשדרגות כל ביס.
  - heading:
      name: אירוע באווירה משוחררת עם סטנדרט גבוה
      slug: ayrva-bavvyrh-mshvhrrt-am-stndrt-gbvh
    text: >-
      למרות שהקונספט של שולחן שוק בשרי הוא קליל ודינמי, אנחנו לא מתפשרים על
      הרמה. מדובר באירוע בוטיק בשרי לכל דבר. אני מקפיד על ניקיון מופתי, אסתטיקה
      גבוהה מאוד בעיצוב השולחן ושירות אדיב ומקצועי. הצוות שלי ואני נמצאים שם כדי
      לוודא שכל אורח מקבל את הנתח המושלם ושהשולחן תמיד נראה שופע ומזמין.


      היתרון הגדול הוא הגמישות. שולחן בשרים לאירועים יכול להתקיים בחצר הבית,
      במשרד, ביער או במדבר. אנחנו מביאים איתנו את כל הציוד הלוגיסטי והתשתית
      הנדרשת כדי להקים את הקרנבל הזה בכל מקום שבו תבחרו לחגוג.
  - heading:
      name: למי זה מתאים?
      slug: lmy-zh-mtaym
    text: >-
      אם אתם מחפשים קייטרינג לאירועים קטנים או גדולים שרוצה לשבור את התבנית של
      "מנה ראשונה-עיקרית-קינוח", זה הפתרון עבורכם. השירות מתאים במיוחד לאנשים
      שאוהבים בשר, אוהבים שפע ואוהבים לראות את האורחים שלהם נהנים מחוויה
      קולינרית לא פורמלית אבל ברמה הכי גבוהה שיש.
  - heading:
      name: 'סיכום: למה לבחור בשולחן שוק של ארי קייטרינג?'
      slug: sykvm-lmh-lbhvr-bshvlhn-shvk-shl-ary-kyytryng
    text: >-
      הבחירה בשולחן שוק בשרי היא בחירה בשמחה, בשפע ובאיכות. אתם מקבלים:


      - **איכות בשר ללא פשרות:** נתחים מובחרים בטיפול אישי של שף.

      - **שירות אדיב ואישי:** צוות שמחייך, מסביר ומארח מכל הלב.

      - **עיצוב עוצר נשימה:** שולחן עשיר שמשדרג כל חלל ואירוע.

      - **חוויה קולינרית דינמית:** אירוע שבו האוכל הוא גם התוכנית האמנותית.


      בין אם אתם מתכננים אירוע בוטיק בשרי בחצר הבית, חגיגת יום הולדת או אירוע
      חברה קליל, שולחן השוק שלנו הוא הדרך הטובה ביותר להבטיח שכולם יצאו שבעים,
      שמחים ומופתעים. מוכנים להדליק את האש? צרו איתי קשר עוד היום ונתחיל לעצב
      יחד את שולחן השוק המושלם לאירוע שלכם צלצלו שילחו ווצאפ או תשאירו
      [כאן](/contact?service=market-tables#quote-form) פרטים ואחזור אליכם בהקדם.
