      מהטאבון: לחמים חמים שיוצאים זה עתה, ירקות מהגינה – גם טריים וגם מנות
      מיוחדות של ירקות בטאבון שסופגים את טעמי האש, לאבנה וגבינות מעולות מהעיזים
      שלנו, פוקצ'ות ופיצות בהתפחה ארוכה ויין מהיקב הפרטי שלנו שנמזג לכוס שלכם על
      המרפסת שלנו מול נוף רחב ופראי. זוהי ארוחה שחוגגת את השפע של הבוסתן ואת
      השקט של ההר.
