      מדובר בארוחת שף בשרית המוגשת במטעים שלנו; גרילים מיוחדים ומעשנות נפרסים על
      הטרסה העליונה במטעים, והבשרים נצלים ומתעשנים בנחת לאורך זמן עד שתגיעו
