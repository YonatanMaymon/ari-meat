sections:
  - heading:
      name: ''
      slug: intro
    text: >-
      יש רגעים בחיים שראויים ליותר ממסעדה רגילה. אם אתם מחפשים ארוחת שף פרטית
      בצפון לרגל יום הולדת עגול, יום נישואין, הרמת כוסית חגיגית עם חברים קרובים
      או פשוט רצון להתכנס יחד סביב שולחן מלא בכל טוב – הגעתם למקום הנכון. אני
      מזמין אתכם אלינו, למרפסת ולמטעים במתת, לחוויה קולינרית פרטית שהיא כולה
      שלכם. לקבוצות מעל 15 אנשים. כאן, מול נוף פראי ורחב, הזמן עוצר מלכת והאירוח
      הופך לזיכרון שילווה אתכם עוד שנים ארוכות.
    image: ../../assets/images/services/private-chef/sections/intro/image.jpg
    imageAlt: >-
      ארוחת טאבון גלילית במתת – לחם ביתי חם על מצע ירקות מהגינה, כרובית צלויה
      ולאבנה
  - heading:
      name: 'אירוח בוטיק לקבוצות קטנות: הרמת כוסית ואירועים אישיים'
      slug: ayrvh-bvtyk-lkbvtzvt-ktnvt-hrmt-kvsyt-vayrvaym-ayshyym
    text: >-
      בין אם אתם מתכננים הרמת כוסית לאירוע פרטי, חגיגת יום הולדת או אירוע משפחתי
      אינטימי, היתרון הגדול שלנו הוא הפרטיות. בניגוד למסעדה עמוסה, כאן תמצאו
      מקום לאירועים קטנים בצפון שסגור רק עבורכם. אתם מקבלים אירוח אישי, שקט
      מוחלט ואת היכולת להתאים את התפריט בדיוק לטעם של האורחים שלכם.


      מה האירוע שלכם כולל?


      - **תפריט בהתאמה אישית:** בחירה בין ארוחת בשרים יוקרתית לארוחת טאבון
      גלילית עשירה או גם וגם.

      - **יין וגבינות מתוצרת מקומית:** יין מהיקב המשפחתי, שמן זית וגבינות
      מהעיזים שלנו.

      - **סיור במטעים:** אפשרות לשלב סיור חקלאי מרגש בבוסתן האורגני שלנו כחלק
      מהאירוע.


      נוף פנורמי: המרפסת שלנו היא התפאורה הטובה ביותר שתוכלו לבקש לאירוע שלכם.
