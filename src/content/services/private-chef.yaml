title: ארוחות פרטיות לקבוצות במתת
seoTitle: ארוחת שף פרטית בצפון – במטעים במתת
description: >-
  ארוחת שף פרטית בצפון, על המרפסת ובמטעים שלנו במתת מול נוף הגליל והים. בשרים
  מהאש, טאבון, יין ושמן זית מתוצרתנו. לקבוצות קטנות.
label: ארוחות פרטיות לקבוצות במתת
summary: יש רגעים בחיים שראויים ליותר ממסעדה רגילה.
subtitle: לחגוג את הרגעים היפים של החיים מול הנוף
steps:
  - title: שיחת היכרות
    text: מספרים לנו מה חוגגים, כמה תהיו ומה מתחשק לכם.
  - title: בונים את הערב
    text: בוחרים בין ארוחת בשרים, טאבון או סדנה, ומוסיפים סיור או סדנאות.
  - title: מגיעים למתת
    text: מתקבלים על המרפסת, מול הנוף, עם כוס יין.
  - title: נשארים ללילה
    text: מי שרוצה יכול להאריך את החוויה עם לינה בצימרים ביישוב.
faqs:
  - question: איפה זה בדיוק?
    answer: >-
      במושב מתת בגליל המערבי, על המרפסת ובמטעים של המשפחה, מול נוף הגליל המערבי
      והים התיכון.
  - question: לכמה אנשים זה מתאים?
    answer: לקבוצות קטנות ולאירועים אינטימיים. ספרו לנו כמה תהיו ונבנה את הערב בהתאם.
  - question: אפשר לישון במתת?
    answer: כן. יש אפשרויות לינה ביישוב, משותפות לקבוצה או בצימרים נפרדים.
  - question: אפשר להוסיף סדנאות?
    answer: >-
      כן. אפשר לשלב סדנת בשרים, סיור במטעים, וסדנאות כמו תיפוף, תנועה או יוגה
      מול הנוף.
  - question: כמה זה עולה?
    answer: >-
      המחיר תלוי במספר האורחים ובסוג הארוחה. ספרו לנו על האירוע ונחזור עם הצעת
      מחיר.
