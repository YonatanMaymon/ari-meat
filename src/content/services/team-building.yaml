      שיתאימו בדיוק לאופי הצוות ולמטרות שהגדרתם. ביחד נבנה את יום הגיבוש
      האקסלוסיבי והאיכותי ביותר שנכון בשבילכם.


      מגוון הסדנאות והפעילויות שלנו כולל:


      - **סיורים מרתקים:** הדרכות על חקלאות מסורתית וסיור במטעים ובגינת הירק
      האורגנית.

      - **סדנאות גוף ונפש:** סדנת יוגה מול הנוף, סדנת נשימה או סדנאות חוסן
      ממוקדות.

      - **סדנאות חוויה ותנועה:** סדנת תיפוף משחררת, סדנת תנועה, סדנאות חקלאות
      וקיימות או חיבור לאדמה.

      - **ארוחות שף מהטאבון:** לחמים חמים, ירקות מהגינה, גם טריים וגם מנות
      מיוחדות של ירקות בטאבון, לאבנה וגבינות מהעיזים שלנו, פוקצ'ות ופיצות בהתפחה
      ארוכה ויין מהיקב הפרטי שלנו שנמזג לכוס שלכם על המרפסת שלנו מול נוף רחב
      ופראי.

      - **חווית בשרים במטעים:** ארוחת שף בשרית במטעים שלנו, גרילים מיוחדים
      ומעשנות נפרסים על הטרסה העליונה במטעים שלנו והבשרים נצלים ומתעשנים בנחת
      לאורך זמן עד שתגיעו לאכול אותם.
