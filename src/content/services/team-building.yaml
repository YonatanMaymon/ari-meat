faqs:
  - question: לכמה משתתפים זה מתאים?
    answer: לקבוצות קטנות, בפורמט סגור ופרטי. ספרו לנו כמה תהיו ונבנה את היום בהתאם.
  - question: אפשר לקיים פגישות עבודה במקום?
    answer: >-
      כן. המקום כולו לרשותכם, כך שאפשר לשלב ישיבות או סיכומי שנה עם הסדנאות
      והארוחות.
  - question: יש אפשרות ללינה?
    answer: כן. יש לינה משותפת לקבוצה או צימרים ובקתות בוטיק נפרדים ביישוב ובסביבה.
  - question: הצוות שלנו לא בצפון, אתם יכולים להגיע אלינו?
    answer: כן. לאירועים במשרד או בשטח ליד הבית, ראו קייטרינג לאירועי חברה.
  - question: כמה זה עולה?
    answer: >-
      המחיר תלוי במספר המשתתפים, בפעילויות ובארוחות. שלחו לנו פרטים ונחזור עם
      הצעה.
