  - heading:
      name: מטבח שף בשרים שנודד איתכם לכל מקום
      slug: mtbh-shf-bshrym-shnvdd-aytkm-lkl-mkvm
    text: >-
      המומחיות שלנו היא הפקת אירועים בשטח המבוססים על מסורת צלייה דרום אמריקאית
      וארגנטינאית, עם טאץ' גלילי מקומי. בתור שף בשרים, אני מאמין שהבסיס
      לקייטרינג בשרי איכותי ומוצלח לחתונה בטבע מתחיל בחומרי הגלם. עבור החתונה
      שלכם, אני בוחר באופן אישי נתחים מובחרים שעברו תהליכי יישון קפדניים, דגים
      טריים ואיכותיים וירקות ופירות ממשקים פרטיים ברמה הכי גבוהה. הבשר שלנו נצלה
      באיטיות על גרילים שנבנו במיוחד עבור תנאי שטח, תוך שימוש בעץ ובפחמים
      שמעניקים לו טעם עמוק וייחודי. התוצאה היא חווית בשרים ייחודית שבו כל נתח
      נפרס מול האורחים בשיא הטריות והדיוק שלו. מעבר לבשרים אנחנו מייצרים בסטייל
      שלנו מנות מיוחדות וטעימות להפליא המתאימות לקהל צמחוני וטבעוני.
  - heading:
      name: 'הלוגיסטיקה: השקט שלכם בתוך הטבע הפראי'
      slug: hlvgystykh-hshkt-shlkm-btvk-htba-hpray
    text: >-
      זוגות רבים חוששים מהמורכבות של הפקת אירועים בטבע. "מה עם החשמל?", "איך
      האוכל יישאר טרי?", "איך שומרים על ניקיון?". כאן נכנס הניסיון הלוגיסטי של
      ארי קייטרינג. אחד מהיתרונות הבולטים שלנו הוא שאנחנו קייטרינג לאירועים ללא
      תשתיות ואנחנו מגיעים לכל מקום עם תשתית מלאה משלנו שמאפשרת לכם ראש שקט:


      - **מטבח חוץ נייד:** אנחנו מקימים מערך בישול עצמאי לחלוטין שמתאים לכל תנאי
      שטח.

      - **פתרונות קירור וחשמל:** ציוד קירור מתקדם וגנרטורים שקטים המבטיחים טריות
      מקסימלית ותפעול חלק ללא תקלות.

      - **צוות מיומן:** המלצרים והטבחים שלנו רגילים לעבוד בתנאי חוץ, בשירות אדיב
      ומתוקתק שתואם את האירוע המיוחד שלכם.

      - **ציוד הגשה מלא:** אנו מספקים את כל הכלי ההגשה והציוד המשלים כדי שהאירוע
      ייראה מושלם ומעוצב.


      המומחיות שלנו בארגון אירועים בשטח מאפשרת לכם להתמקד ביום שלכם ובאהבה, בזמן
      שאנחנו מנהלים את האופרציה המורכבת של קייטרינג לאירועי חוץ בסטנדרט של חמישה
      כוכבים.
  - heading:
      name: 'התפריט: מסע של טעמים מהגליל ועד ארגנטינה'
      slug: htpryt-msa-shl-tamym-mhglyl-vad-argntynh
    text: >-
      כשאנחנו ניגשים לגבש תפריט של חתונה בטבע, אנחנו תופרים את הסגנון בדיוק
      למידות שלכם, להעדפות, לאופי שלכם ולמיקום האירוע, תוך הקפדה על חומרי גלם
      מקומיים ואיכותיים מהגליל המערבי.


      חשוב לנו שכל אורח יצא שבע ומרוצה, ולכן אנו מציעים גם הרבה מנות לצמחוניים
      וטבעוניים. מנות השף הצמחוניות שלנו מקבלות את אותו הטיפול המסור על האש, עם
      ירקות מעושנים ומנות יצירתיות שמשלימות את החוויה הבשרית מבלי להתפשר על
      הטעם.הנה כמה מנות לדוגמה:


      - **קבלת פנים:** עמדות בשרים פעילות, נקניקיות בוטיק בייצור עצמי, צ׳וריפאן,
      אמפנדס ביצור עצמי, פוקצ׳ות ומאפים שנעשים במקום, לחמים וממרחים מיוחדים,
      סביצ׳ה עונתי, קרפצ׳יו מכל מיני שורשים ועוד הרבה מנות קטנות יצרתיות וטעימות

      - **המנה העיקרית:** נתחי פרימיום כמו אנטריקוט משויש, סינטה מיושנת, פיקנייה
      מעושנת, אסאדו שנצלה במשך שעות ארוכות בטכניקה מסורתית מעל אש חיה, סלמון
      מעושן, דגים שלמים תויים על אש חיה, עופות שלמים וממולאים, צלעות ועוד.

      - **עקריות לצמחונים/טבעונים:** פויקה ותבשילי קדרה צמחוניים עם מגוון
      שורשים, ירקות ועדשים, סופלאקי פטריות, סטייקים של חציל, כרוב או ברוקולי עם
      רטבים איכותיים ומיני אגוזים ועשבים ירוקים, סיחים של ירקות צלויים או פטריות
      ועוד הרבה מנות מיוחדות ויצרתיות שנעשות בסטייל של ארי

      - **התוספות והגליליות:** מגוון ירקות ושורשים צלויים באש, סלטים רעננים
      ממשקי הגליל ולחמים חמים מהטאבון, תפוחי אדמה במגוון צורות בישול, תירס חם,
      עמדות פסטה ועוד הרבה אופציות


      בנוסף יש גם קינוחים מעלפים ואופציות לאפטרים. לקריאה מורחבת על התפריטים
      והסגנון שלנו [לחצו כאן](/menu)
  - heading:
      name: 'חתונת בוטיק בטבע: שירות אישי לכל איזור בארץ'
      slug: htvnt-bvtyk-btba-shyrvt-ayshy-lkl-ayzvr-bartz
    text: >-
      כשאני מפיק קייטרינג בשרי כשר לחתונה בטבע, אני נמצא שם באופן אישי. הזיקה
      שלי לאדמה והמגורים שלי במושב מתת שבגליל המערבי מחלחלים לכל אירוע. אני מביא
      איתי את השקט של ההר, את האיכות של החקלאות האורגנית ואת האדיבות הגלילית. גם
      אם אתם מתכננים חתונת שטח בשרית אינטימית ל-50 איש ומחפשים שף בשרים פרטי
      לחתונה וגם אם אתם מתכננים אירוע גדול ומורכב, אנחנו יודעים להתאים את עצמנו
      למידות שלכם וליצור רגעים שיישארו איתכם ועם האורחים שלכם לכל החיים.


      בין אם אתם מתכננים חתונה בשטח בצפון בין הכרמים או בין היערות, חתונה בטבע
      במרכז על חוף הים או חתונה בטבע בדרום, במדבר או בערבה אנחנו נדע להגיע לכל
      נקודה. כבר ערכנו אירועים בצפון הרחוק, ברמת הגולן, באיזורי הכנרת, בגליל
      התחתון, העליון והמערבי והקייטרינג שלנו מגיע גם לצפון הפחות רחוק כמו עמק
      יזרעאל, זכרון יעקב, חיפה, ישובי הר הכרמל, פרדס חנה ובנימינה. כמו כן גם
      באיזורי המרכז, גוש דן, תל אביב, רמת השרון, הרצליה וכל איזור השרון, עמק חפר
      וחוף הכרמל וערכנו גם אירועים בהרי ירושלים, באזור השפלה וים המלח. וגם
      לדרום, למדבר יהודה, לערבה ואיזורי הנגב אנחנו נגיע בשבילכם ממתת הרחוקה.
  - heading:
      name: 'לסיכום: למה לסגור עם ארי קייטרינג?'
      slug: lsykvm-lmh-lsgvr-am-ary-kyytryng
    text: >-
      בחירת ספק קייטרינג לחתונה בטבע היא החלטה של אמון. אתם צריכים מישהו שבאמת
      מבין בשטח, מישהו שלא נבהל מתנאי מזג אוויר או מדרכי גישה מורכבות, ובעיקר –
      מישהו שאוהב בשר, אדמה, ירקות, חומרי גלם איכותיים ואוהב לארח מכל הלב. אנחנו
      מציעים לכם שילוב נדיר של:


      - **מקצועיות קולינרית:** מטבח שף בשרי ברמה הגבוהה ביותר.

      - **ניסיון בשטח:** פתרון לוגיסטי לכל אתגר בטבע הפראי.

      - **אותנטיות:** סיפור אישי של אש ואדמה, חיוך ואהבה לאירוח.


      האש שלנו כבר מוכנה, הנתחים מחכים, וכל מה שנשאר לכם זה לבחור את הנקודה הכי
      יפה בטבע שבה תרצו להגיד "כן".


      רוצים לתכנן את חתונת החלומות שלכם בשטח? צרו איתי קשר עוד היום ונתחיל לבנות
      יחד תפריט שמתאים בדיוק לסיפור שלכם. מוזמנים לצלצל, לשלוח ווצאפ או להשאיר
      [כאן](/contact?service=weddings#quote-form) פרטים ואחזור אליכם בהקדם.
