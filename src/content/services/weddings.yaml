group: catering
order: 1
title: קייטרינג לחתונה בטבע
seoTitle: קייטרינג לחתונה בטבע – בשרים על האש
description: >-
  קייטרינג בשרי לחתונה בטבע ובשטח, עם אש חיה בכל מקום בארץ. מטבח שטח עצמאי,
  נתחים מובחרים ומנות לצמחונים. ספרו לנו על החתונה וקבלו הצעת מחיר.
label: חתונות בטבע
summary: >-
  אני יודע לקחת את כל הציוד הלוגיסטי המורכב ביותר ולבצע ארגון אירועים בשטח ברמה
  של מסעדת שף בלב היער, במדבר או מול הים.
subtitle: >-
  חוויה קולינרית ייחודית של אש, בשר ואדמה שמתחברת בצורה הכי טבעית ואותנטית לאהבה
  שיש באוויר בין הזוג, המשפחה והחברים
steps:
  - title: שיחת היכרות
    text: מספרים לנו על החתונה, המקום, מספר האורחים והאווירה שאתם רוצים.
  - title: תפריט והצעת מחיר
    text: בונים יחד תפריט שמתאים לכם ולמקום, ומקבלים הצעת מחיר מסודרת.
  - title: ביום החתונה
    text: מגיעים לפחות 5 שעות לפני, מקימים את המטבח ומדליקים את האש.
  - title: אירוח עד הסוף
    text: מגישים ופורסים מול האורחים, ומשאירים את השטח נקי ומסודר.
faqs:
  - question: אפשר לעשות חתונה במקום בלי חשמל ומים?
    answer: >-
      כן. אנחנו מגיעים עם מטבח שטח עצמאי, ציוד קירור וגנרטורים שקטים, כך שהמקום
      לא צריך תשתיות משלו.
  - question: יש מנות לצמחונים ולטבעונים?
    answer: >-
      כן, והן לא תוספת אחרונה. יש מנות עיקריות צמחוניות וטבעוניות שנעשות גם הן
      על האש, לצד סלטים, ירקות צלויים ולחמים.
  - question: לאילו אזורים אתם מגיעים?
    answer: >-
      לכל הארץ. ערכנו חתונות ואירועים מהגולן והגליל, דרך המרכז והשרון, ועד הרי
      ירושלים, ים המלח, הנגב והערבה.
  - question: כמה זמן לפני האירוע אתם מגיעים?
    answer: >-
      לפחות 5 שעות לפני. צלייה ועישון של בשר דורשים זמן, וזה גם הזמן שבו אנחנו
      מקימים את המטבח.
  - question: כמה עולה קייטרינג לחתונה?
    answer: >-
      המחיר תלוי במספר האורחים, בתפריט ובמיקום. ספרו לנו על החתונה ונחזור אליכם
      עם הצעת מחיר מסודרת.
  - question: מתאים גם לחתונה קטנה?
    answer: >-
      כן. אנחנו עושים גם חתונות בוטיק אינטימיות של עשרות אורחים, וגם אירועים
      גדולים.
