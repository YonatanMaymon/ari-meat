      slug: intro
    text: >-
      החלום על חתונה בטבע מתחיל בדרך כלל בתמונה בראש: חופה מול שקיעה, אוויר פתוח
      ותחושת חופש שאי אפשר למצוא באף אולם אירועים סגור. אבל כדי שהחלום הזה יהפוך
      למציאות בלתי נשכחת, המרכיב החשוב ביותר הוא האוכל – הריח של האש, הטעם של
      הבשר האיכותי והחוויה שמחברת בין האורחים לאדמה. בארי קייטרינג, אנו מתמחים
      בהפיכת השטח למסעדת שף בשרית, ומביאים את חווית הקייטרינג לחתונה בטבע לרמה
      הגבוהה ביותר שיש.
  - heading:
      name: למה לבחור בחתונה בשטח?
      slug: lmh-lbhvr-bhtvnh-bshth
    text: >-
      חתונה בטבע היא הרבה יותר מאירוע, היא הצהרה. היא אומרת שאתם מחפשים משהו
      אמיתי, חשוף ואותנטי. כשאנחנו מקימים את הגרילים והמעשנות שלנו בלב יער
      גלילי, במטעים ומשקים, מול הים או במדבר, אנחנו לא רק מבשלים – אנחנו מייצרים
      אווירה. האש החיה היא לא רק כלי בישול, היא המרכז של האירוע.


      החלום על חתונה בטבע מתחיל בדרך כלל בתמונה בראש: חופה מול שקיעה, אוויר פתוח
      ותחושת חופש שאי אפשר למצוא באף אולם אירועים סגור. אבל כדי שהחלום הזה יהפוך
      למציאות בלתי נשכחת, המרכיב החשוב ביותר הוא האוכל – הריח של האש, הטעם של
      הבשר האיכותי והחוויה שמחברת בין האורחים לאדמה. בארי קייטרינג, אנו מתמחים
      בהפיכת השטח למסעדת שף בשרית, ומביאים את החוויה לרמה הגבוהה ביותר שיש.
    image: >-
