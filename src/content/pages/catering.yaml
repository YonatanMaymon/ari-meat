  לשאלות נפוצות.
areasEyebrow: אזורי שירות
areasHeading: מגיעים לכל הארץ
areasIntro: >-
  הבית שלנו במתת שבגליל, והאש נודדת איתנו לכל מקום. אלה האזורים שבהם אנחנו
  עובדים הכי הרבה.
