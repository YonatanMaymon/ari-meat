heroAlt: שולחנות עגולים ערוכים לאירוע בגינה
heroTitle: קייטרינג בשרי לאירועים
heroSubtitle: >-
  אנחנו מגיעים אליכם: לחצר, למשרד, ליער, לחוף או למדבר. עם גרילים, מעשנות, צוות
