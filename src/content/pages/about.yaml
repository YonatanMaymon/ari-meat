heroAlt: גריל דרום אמריקאי מעל בור אש בגינה
heroTitle: ארי - חווית בשר ייחודית
heroSubtitle: הסיפור שמאחורי האש, הבשר והאדמה
sections:
  - tone: light
    text: >-
      לכל אחד יש דרך למצוא את השקט שלו, אני מוצא את שלי מול גחלים לוחשות, בלב
      המטעים או במטבח. שמי ארי, והסיפור של "ארי קייטרינג" הוא לא סיפור על עסק
      למזון, אלא מסע של תשוקה ישנה לאדמה, לאש ולאנשים.


      הכל התחיל במושב מתת שבגליל המערבי. מקום שבו הטבע הוא לא רק תפאורה, אלא דרך
      חיים. שם, בין המטעים לבוסתנים, למדתי שאירוח אמיתי מתחיל בכבוד עמוק לחומר
      הגלם ובסבלנות שרק האש יכולה ללמד. כיום, כשאני מוביל קייטרינג בשרי לאירועים
      בכל רחבי הארץ, הערכים האלו הם המצפן שלי.
  - heading: 'מהחווה לשולחן: השורשים במתת'
    tone: sand
    text: >-
      הזהות הקולינרית שלי כשף בשרים נטועה עמוק באדמה. בבית שלי במתת, אני מיישם
      את עקרונות ה-"Farm to Table" (מהחווה לשולחן) במובן הכי שורשי שלהם: שמן זית
      מהעצים שלנו, ירקות שנקטפו בבוקר מהשדה שלי או של שכניי וכוס יין טובה בערב
      שאנחנו מייצרים מהגפנים שלנו.


      אני מאמין שבישול טוב דורש קשר ישיר עם מוצרי הגלם והבנה של העונות. בין אם
      מדובר בקייטרינג ליום הולדת, קייטרינג לבר מצווה או קייטרינג לחתונה בטבע,
      אני מביא איתי את הניחוח הגלילי והמסורת הארגנטינאית. הבשר נבחר בפינצטה לפי
      רמת היישון והשיוש שלו, וכל מנה עוברת תחת הידיים שלי לפני שהיא פוגשת את
      האש.
  - heading: 'אומנות הברזל: כשהשף בונה את המטבח שלו'
    tone: light
    text: >-
      מה שמייחד אותנו הוא לא רק מה שאנחנו מבשלים, אלא איך אנחנו מבשלים. אני לא
      משתמש בציוד תעשייתי סטנדרטי. מתוך תשוקה לדיוק מוחלט, תכננתי ובניתי במו ידי
      את המעשנות והגרילים של "ארי קייטרינג".


      המעשנות שלי נבנו במיוחד עבורי ואני עובד עם זני עץ ספציפיים כמו אלון,
      דובדבן ושקד המעניקים לבשר ארומה עמוקה שאי אפשר לחקות. בניית הציוד בעצמי
      מעניקה לי שליטה מוחלטת בטמפרטורה ובזרימת העשן – מה שמבטיח שכל נתח שיוצא
      תחת ידי יהיה בסטנדרט של קייטרינג בשרי איכותי יוקרתי.
  - heading: השטח הוא המגרש הביתי שלנו
    tone: sand
    text: >-
      'איך אפשר להוציא ארוחת שף בלב המדבר או ביער מבודד?'. התשובה היא ניסיון
      לוגיסטי של שנים. ארי קייטרינג מגיע לכל נקודה בארץ עם עצמאות מלאה – ממטבחי
      חוץ וגרילים בבנייה אישית, דרך מערכות קירור מתקדמות לשמירה על טריות הבשר,
      ועד גנרטורים שקטים ותאורה. אנחנו לא צריכים תשתיות, אנחנו מביאים אותן
      איתנו. אתם בוחרים את הלוקיישן הכי פרוע שחלמתם עליו – אנחנו דואגים שרמת
      האוכל והשירות תהיה של מסעדת עילית, גם בקצה העולם.


      אנחנו מגיעים אליכם לכל מקום: כבר ערכנו אירועים בצפון הרחוק, ברמת הגולן
      והכנרת, בגליל, עמק יזרעאל, חיפה והכרמל, דרך אזור השרון, גוש דן ותל אביב,
      ועד הרי ירושלים, ים המלח, מדבר יהודה והנגב.
  - heading: אירוח בגובה העיניים
    tone: light
    text: >-
      למרות הסטנדרט המקצועי הגבוה, האירוח שלנו תמיד נשאר בגובה העיניים. השירות
      הוא חלק בלתי נפרד מהטעם. בין אם מדובר בקייטרינג לאירועים קטנים בבית הלקוח
      ובין אם בקייטרינג לאירועי חברה גדולים, הצוות שלי ואני מגיעים כדי לשמח.
      אנחנו דואגים לניקיון מופתי, לסדר לוגיסטי ולתשומת לב לכל פרט, כדי שאתם
      תוכלו להיות אורחים באירוע שלכם.
  - heading: 'הבית במתת: סדנאות וריטריטים'
    tone: sand
    text: >-
      הלב שלי נשאר בגליל. הבית והמטעים במתת הם המקום שבו אני מארח סדנאות בשרים
      חווייתיות ויום גיבוש למנהלים ולצוותי פיתוח. שם, מול הנוף הפנורמי, אנו
      מקיימים ריטריט ו- offsite קולינרי המשלב חיבור לאדמה וזמן איכות לקבוצות מול
      האש והחורש. כמו כן, אנחנו גם עורכים במטעים שלנו גם אירועים קטנים ופשוטים
      יותר למשפחות או קבוצות חברים.


      אני מזמין אתכם להצטרף אלינו לחגיגה של אש, בשר ואדמה. בואו נהפוך את האירוע
      שלכם לזיכרון גלילי שורשי ובלתי נשכח. לפרטים נוספים עבור ימי הגיבוש [לחצו
      כאן](/matat/team-building) ועבור ארוחות פרטיות בבית שלי במתת [לחצו
      כאן](/matat/private-chef).
