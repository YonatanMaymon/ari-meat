heroTitle: קבלת הצעת מחיר
heroSubtitle: אנא מלאו את הפרטים ואתקשר אליכם בהקדם
channelsHeading: מעדיפים לדבר?
whatsappText: הכי מהיר. כתבו לנו כמה פרטים על האירוע.
phoneText: הכי טוב פשוט להתקשר.
emailText: לשאלות, הצעות ומסמכים.
locationHeading: איפה אנחנו
locationText: >-
  לאירועים אנחנו מגיעים לכל הארץ. לארוחות שף וימי גיבוש במטעים, מגיעים אלינו
  למתת בתיאום מראש.
