heroImage: ../../assets/images/pages/matat/heroImage.jpg
heroAlt: שקיעה מעל הרי הגליל, כפי שהיא נשקפת ממתת
heroTitle: חוויות במטעים במתת
heroSubtitle: >-
  אתם מגיעים אלינו: למרפסת מול הנוף, למטעים ולגינת הירק. ארוחות שף, סדנאות וימי
  גיבוש, בפרטיות מלאה.
heroEyebrow: מושב מתת, הגליל המערבי
placeHeading: המקום
placeIntro: >-
  מתת יושבת על הר שמשקיף על קפלי הגליל המערבי עד הים התיכון, ממש על גבול הלבנון.
  מה שהיה פעם כיפת הר קירחת הוא היום בוסתן של חקלאות אורגנית: זיתים, גפנים,
  תאנים ודובדבנים.
