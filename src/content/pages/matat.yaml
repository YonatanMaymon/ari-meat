storyHeading: 'הסיפור שלי ושל מתת: חקלאות, חוסן וציונות'
storyText: >-
  מתת זה מקום מיוחד במינו. זוהי דוגמה לאופן שבו קבוצת אנשים קטנה, עם מעט
  משאבים מלבד השכל וכוחם הפיזי, הצליחה לשנות מציאות גאוגרפית של כיפת הר
  קירחת ושוממת ולהפוך אותה למצפה משגשג. היום, מתת היא בוסתן עשיר וצבעוני של
  חקלאות מסורתית אורגנית, ששומרת על הטבע הפראי ומייצרת בתוכו אווירה קסומה של
  שפע ופשטות.


  הר מתת משקיף מצד אחד על קיפולי הקרקע המרשימים של הגליל המערבי ועד עומק הים
  התיכון, ומצד שני צפונה ומזרחה אל לבנון, סוריה והחרמון. אנחנו ממוקמים 700
  מטרים מהגבול, ממש התלם האחרון. מאז ה-7 באוקטובר עברנו שנתיים לא פשוטות,
  חטפנו לא מעט קטיושות, אבל נשארנו כאן כדי לשמור על מה ששלנו. הגישה שלנו היא
  פשוטה: על כל קטיושה שפגעה – שתלנו עץ חדש. מעבר לאוכל וליין, אני מזמין אתכם
  לטעום מאורך החיים שלנו ומרוח הציונות והחוסן הייחודית של מתת.
